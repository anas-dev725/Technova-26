<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#000" />
  <g filter="url(#neon)">
    <!-- Outer Circle -->
    <circle cx="200" cy="200" r="150" fill="none" stroke="url(#glow)" stroke-width="8" />
    
    <!-- Inner Shapes (Stylized Star/A) -->
    <path d="M 200 70 L 260 180 L 140 180 Z" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linejoin="round" />
    <path d="M 120 200 L 180 310 L 60 310 Z" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linejoin="round" />
    <path d="M 280 200 L 340 310 L 220 310 Z" fill="none" stroke="url(#glow)" stroke-width="8" stroke-linejoin="round" />
  </g>
</svg>
